[project]
name = "com-starfall-betterday"
version = "1.2.0"
description = "更好的一天 - Class Widgets 2 插件"
authors = [
    {name = "落落"},
]
readme = "README.md"
requires-python = ">=3.9"
# 打包时 cw-plugin-pack 会把这些依赖装进插件的 libs/ 目录
dependencies = ["lunar-python>=1.4.0"]

[project.optional-dependencies]
# 本地跑插件冒烟测试时需要（发布环境自带）
dev = ["PySide6-Essentials>=6.5"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
